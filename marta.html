<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Protocolo Autónomo</title>
    <style>
        /* Diseño de Interfaz Futurista de J.A.R.V.I.S. */
        body {
            background-color: #020b14;
            color: #4ef2d2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .interface-container {
            background: rgba(4, 28, 44, 0.6);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(10px);
            width: 420px;
        }

        h1 {
            font-size: 26px;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffcc;
        }

        .status {
            font-size: 11px;
            color: #8ab4f8;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .audio-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 10px;
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .audio-title {
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        audio {
            width: 100%;
            height: 40px;
            outline: none;
        }

        .system-core {
            width: 70px;
            height: 70px;
            border: 4px dashed #00ffcc;
            border-radius: 50%;
            margin: 0 auto 25px auto;
            animation: rotate 8s linear infinite;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        <div class="system-core"></div>
        <h1>J.A.R.V.I.S.</h1>
        <div class="status">Carga Local de Datos Completada</div>

        <div class="audio-card">
            <div class="audio-title">REPRODUCIENDO: Base de Datos Interna</div>
            <!-- El reproductor está preparado para recibir el audio directo del script -->
            <audio id="jarvisPlayer" controls></audio>
        </div>
    </div>

    <script>
        // Este script inyecta de forma autónoma el archivo local "audio.mp3" dentro del reproductor
        window.addEventListener('DOMContentLoaded', () => {
            const player = document.getElementById('jarvisPlayer');
            player.src = 'audio.mp3';
            player.load();
        });
    </script>

</body>
</html>
